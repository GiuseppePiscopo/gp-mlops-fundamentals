$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
# name intentionally omitted: Azure ML auto-generates a unique run name on every submit
display_name: gp-mof-capstone-random-forest
experiment_name: gp-mof-capstone
description: Random Forest training for MLOps Fundamentals capstone project.

code: ../src
command: >-
  python -m random_forest.train
  --training_data ${{inputs.training_data}}
  --n_estimators ${{inputs.n_estimators}}
  --max_depth ${{inputs.max_depth}}
  --fail_for_alert_test ${{inputs.fail_for_alert_test}}

inputs:
  training_data:
    type: uri_folder
    path: azureml:gp-mof-capstone-data:1
  n_estimators: 50
  max_depth: 5
  fail_for_alert_test: false

environment: azureml:gp-mof-capstone-env:2
compute: azureml:gp-mof-capstone-compute
