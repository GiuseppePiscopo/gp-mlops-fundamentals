$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
# name intentionally omitted: Azure ML auto-generates a unique run name on every submit
display_name: gp-mof-capstone-ridge-scaled
experiment_name: gp-mof-capstone
description: Scaled Ridge regression training for the MLOps Fundamentals capstone project.

code: ../src
command: >-
  python -m ridge_scaled.train
  --training_data ${{inputs.training_data}}
  --alpha ${{inputs.alpha}}

inputs:
  training_data:
    type: uri_folder
    path: azureml:gp-mof-capstone-data:1
  alpha: 1.0

environment: azureml:gp-mof-capstone-env:2
compute: azureml:gp-mof-capstone-compute
