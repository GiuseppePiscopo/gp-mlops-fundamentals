name: gp-mof-capstone-env-conda
description: Conda environment for MLOps Fundamentals capstone project.
channels:
  - defaults
dependencies:
  - python=3.11
  - pip=24.0
  - pip:
      # pinned <2.0: RAI dashboard's curated environment can't unpickle models saved with numpy 2.x
      - numpy==1.26.4
      - pandas==2.2.3
      - scikit-learn==1.6.1
      # gradient boosting baseline, complements sklearn's RandomForest/HistGradientBoosting
      - xgboost==2.1.3
      - mlflow==2.19.0
      - azureml-mlflow==1.60.0
      - matplotlib==3.10.0
