[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = [
  ".git",
  ".venv",
  "node_modules",
  "**/output",
  "**/images",
  "**/data",
  "**/datasets",
  "**/input",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
